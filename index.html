<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banda Ki Seva | Ration Order</title>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:#0a8f3c;color:#fff;padding:12px;text-align:center;font-size:20px;font-weight:bold}
.categories{display:flex;overflow-x:auto;background:#fff;padding:10px}
.cat-btn{padding:8px 14px;background:#eee;border-radius:20px;margin-right:8px;font-size:14px;cursor:pointer;white-space:nowrap}
.cat-btn.active{background:#0a8f3c;color:#fff}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.item{background:#fff;border-radius:10px;padding:8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.item h4{margin:6px 0;font-size:14px}
.qty{display:flex;justify-content:space-between;align-items:center}
.qty button{width:28px;height:28px;border:none;background:#0a8f3c;color:#fff;font-size:18px;border-radius:50%}
.cart{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;box-shadow:0 -2px 6px rgba(0,0,0,.2)}
.cart button{width:100%;padding:10px;background:#25D366;border:none;color:#fff;font-size:16px;border-radius:8px;margin-top:6px}
.removeBtn{
 background:red;color:#fff;border:none;
 border-radius:4px;padding:2px 6px;
 margin-left:6px;cursor:pointer
}
</style>
</head>

<body>

<script>
let colony = prompt("आप किस कॉलोनी से हैं?");
if(colony !== "Swaraj Colony"){
 alert("❌ सेवा सिर्फ Swaraj Colony के लिए है");
 document.body.innerHTML="";
}
</script>

<header>🛒 Banda Ki Seva – Ration Order</header>

<div class="categories">
 <div class="cat-btn active" onclick="filterCat('all')">सभी</div>
 <div class="cat-btn" onclick="filterCat('दाल')">दाल</div>
 <div class="cat-btn" onclick="filterCat('चावल')">चावल</div>
 <div class="cat-btn" onclick="filterCat('आटा')">आटा</div>
 <div class="cat-btn" onclick="filterCat('मसाला')">मसाले</div>
 <div class="cat-btn" onclick="filterCat('तेल')">तेल</div>
 <div class="cat-btn" onclick="filterCat('नमकीन')">नमकीन</div>
</div>

<div class="items">

<!-- ===== दाल ===== -->
<div class="item" data-cat="दाल">
<h4>चना दाल</h4>
<div class="qty">
<button onclick="addItem('दाल','चना दाल','Kg')">+</button>
<span id="चना दाल">0 Kg</span>
<button onclick="removeItem('चना दाल','Kg')">−</button>
</div></div>

<div class="item" data-cat="दाल">
<h4>अरहर दाल</h4>
<div class="qty">
<button onclick="addItem('दाल','अरहर दाल','Kg')">+</button>
<span id="अरहर दाल">0 Kg</span>
<button onclick="removeItem('अरहर दाल','Kg')">−</button>
</div></div>

<!-- ===== चावल ===== -->
<div class="item" data-cat="चावल">
<h4>बासमती चावल</h4>
<div class="qty">
<button onclick="addItem('चावल','बासमती चावल','Kg')">+</button>
<span id="बासमती चावल">0 Kg</span>
<button onclick="removeItem('बासमती चावल','Kg')">−</button>
</div></div>

<div class="item" data-cat="चावल">
<h4>साधारण चावल</h4>
<div class="qty">
<button onclick="addItem('चावल','साधारण चावल','Kg')">+</button>
<span id="साधारण चावल">0 Kg</span>
<button onclick="removeItem('साधारण चावल','Kg')">−</button>
</div></div>

<!-- ===== आटा ===== -->
<div class="item" data-cat="आटा">
<h4>गेहूं आटा</h4>
<div class="qty">
<button onclick="addItem('आटा','गेहूं आटा','Kg')">+</button>
<span id="गेहूं आटा">0 Kg</span>
<button onclick="removeItem('गेहूं आटा','Kg')">−</button>
</div></div>

<!-- ===== मसाले ===== -->
<div class="item" data-cat="मसाला">
<h4>हल्दी</h4>
<div class="qty">
<button onclick="addItem('मसाला','हल्दी','Gram')">+</button>
<span id="हल्दी">0 Gram</span>
<button onclick="removeItem('हल्दी','Gram')">−</button>
</div></div>

<div class="item" data-cat="मसाला">
<h4>धनिया</h4>
<div class="qty">
<button onclick="addItem('मसाला','धनिया','Gram')">+</button>
<span id="धनिया">0 Gram</span>
<button onclick="removeItem('धनिया','Gram')">−</button>
</div></div>

<!-- ===== तेल ===== -->
<div class="item" data-cat="तेल">
<h4>सरसों तेल</h4>
<div class="qty">
<button onclick="addItem('तेल','सरसों तेल','लीटर')">+</button>
<span id="सरसों तेल">0 लीटर</span>
<button onclick="removeItem('सरसों तेल','लीटर')">−</button>
</div></div>

<!-- ===== नमकीन ===== -->
<div class="item" data-cat="नमकीन">
<h4>मिक्स नमकीन</h4>
<div class="qty">
<button onclick="addItem('नमकीन','मिक्स नमकीन','पैकेट')">+</button>
<span id="मिक्स नमकीन">0 पैकेट</span>
<button onclick="removeItem('मिक्स नमकीन','पैकेट')">−</button>
</div></div>

</div>

<div class="cart">
<b>🛒 Cart</b>
<div id="cartData">कोई आइटम नहीं</div>
<button onclick="sendWhatsApp()">WhatsApp Order भेजें</button>
</div>

<script>
let cart = {};

function addItem(cat,name,unit){
 if(!cart[cat]) cart[cat]={};
 if(!cart[cat][name]) cart[cat][name]={q:0,u:unit};
 cart[cat][name].q++;
 document.getElementById(name).innerText =
   cart[cat][name].q+" "+unit;
 updateCart();
}

function removeItem(name,unit){
 for(let cat in cart){
  if(cart[cat][name]){
   cart[cat][name].q--;
   document.getElementById(name).innerText =
     Math.max(cart[cat][name].q,0)+" "+unit;
   if(cart[cat][name].q<=0){
    delete cart[cat][name];
   }
  }
 }
 updateCart();
}

function removeFullItem(cat,item){
 delete cart[cat][item];
 document.getElementById(item).innerText="0";
 if(Object.keys(cart[cat]).length===0){
  delete cart[cat];
 }
 updateCart();
}

function updateCart(){
 let h="";
 for(let c in cart){
  h+="<b>"+c+"</b><br>";
  for(let i in cart[c]){
   h+= `${i} : ${cart[c][i].q} ${cart[c][i].u}
   <button class="removeBtn"
   onclick="removeFullItem('${c}','${i}')">❌</button><br>`;
  }
 }
 document.getElementById("cartData").innerHTML =
   h || "कोई आइटम नहीं";
}

function sendWhatsApp(){
 let m="🛒 *Ration Order*\n\n";
 for(let c in cart){
  m+="📌 "+c+"\n";
  for(let i in cart[c]){
   m+=`- ${i} : ${cart[c][i].q} ${cart[c][i].u}\n`;
  }
  m+="\n";
 }
 window.open("https://wa.me/916351598832?text="+encodeURIComponent(m));
}

function filterCat(cat){
 document.querySelectorAll(".item").forEach(i=>{
  i.style.display=(cat==="all"||i.dataset.cat===cat)?"block":"none";
 });
 document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");
}
</script>

</body>
</html>
